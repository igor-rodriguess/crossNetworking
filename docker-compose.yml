services:
  db:
    image: postgres:16
    container_name: cross-db
    environment:
      POSTGRES_DB: cross_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cross_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cross_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cross_db_data:
