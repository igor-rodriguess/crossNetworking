    configuration: { endpoint_in_code: "https://api.openai.com/v1/embeddings", dimension: 1536 }
    environment_variables: [OPENAI_API_KEY, OPENAI_EMBED_MODEL, AI_MOCK]
    allowed_agents: [knowledge_rag]
    limits: { max_chunks_per_ingestion: 100, timeout_seconds: null }
