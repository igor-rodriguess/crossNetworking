  observability:
    category: observability
    status: implemented
    priority: 5
    purpose: "Auditar execuções, erros, tokens, duração, métricas HTTP e saúde do banco."
    package_or_service: "Pino, pino-http e scripts db-health"
    implementation_evidence: "backend/src/shared/logger.ts; metrics.ts; scripts/db-health.ts"
    configuration: { metrics_route: "/metrics", audit_table: "cross_ai.execucao_agente" }
    environment_variables: [LOG_LEVEL, METRICS_TOKEN]
    allowed_agents: [all_agents]
    limits: { timeout_seconds: null }
    fallback: "Logs de erro da aplicação."
    restrictions: ["Não registrar tokens, chaves, URLs sensíveis ou dados pessoais."]
    data_produced: ["métricas Prometheus agregadas", "eventos de auditoria"]
    data_persisted: ["auditoria no PostgreSQL"]
    risks: ["Envelope padrão completo ainda não é imposto por schema único."]

  api_security:
    category: platform
    status: implemented
    priority: 5
    purpose: "Autenticação, autorização, rate limit, CORS, Helmet e limite de corpo."
    package_or_service: "Express, helmet, cors, express-rate-limit"
    implementation_evidence: "backend/src/app.ts; backend/src/modules/agentes/agentes.routes.ts"
    configuration: { route_prefix: "/v1/agentes", execution_roles: [estrategista, coordenador, administrador], human_gate_roles: [coordenador, administrador] }
    environment_variables: [JWT_SECRET, ACCESS_TOKEN_TTL_MIN, REFRESH_TOKEN_TTL_DAYS, CORS_ORIGIN, TRUST_PROXY, REQUEST_BODY_LIMIT, RATE_LIMIT_MAX, RATE_LIMIT_WINDOW_MS]
    allowed_agents: [all_authenticated_agents]
    limits: { default_body_limit: "1mb", default_rate_limit_max: 300, default_rate_limit_window_ms: 60000 }
    fallback: "Rejeição HTTP e middleware de erro."
    restrictions: ["Executar agentes exige papel autorizado.", "Human Gate exige coordenador ou administrador."]
    data_produced: ["respostas HTTP autenticadas"]
    data_persisted: []
